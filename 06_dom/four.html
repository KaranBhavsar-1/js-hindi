<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Chai aur Code</title>
</head>
<body style="background-color: black; color: beige;">
    <ul class="language">
        <li>javaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
        const li = document.createElement('li')
        li.innerText = langName
        document.querySelector(`.language`).appendChild(li)
    }
    addLanguage("Python")
    addLanguage("Java")
    addLanguage("C++")
    addLanguage("Ruby")

    //best Way 
    function addoPTILanguage(langName) {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName)) 
        document.querySelector(`.language`).appendChild(li)
    }
    addoPTILanguage("koko")

    //EDIT:- Change the 2nd lan, python --> MOjo
    const secondLang = document.querySelector("li:nth-child(2)")
    // secondLang.innerText = "mojo"  //Slow

    //fast(optimized)
    const newLi = document.createElement('li')
    newLi.textContent = "MOjo"
    secondLang.replaceWith(newLi)

    // edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>dickpick</li>"

    //remove
    const lastLang = document.querySelector("li:last-child")
    // console.log(lastLang)
    // lastLang.outerHTML = "<li>dickpick</li>"
    lastLang.remove()
</script>
</html>
