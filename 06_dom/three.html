<body style="background-color: black; color: beige;">

<script>

// ************Create Element Using JS************
    const div = document.createElement('div');
    console.log(div)
    div.className = "main"
    div.id = Math.round(Math.random()*10 + 1)
    div.setAttribute("Title", "Generate title")
    div.style.backgroundColor = "Green"
    div.style.color = "red"
    // div.innerText = "donkey Hodo ddoflamingo"
    const addText = document.createTextNode("Chai Aur chodo")
    div.appendChild(addText)
    document.body.appendChild(div)

    function createDiv (Text) {
        const div = document.createElement('div')
        div.style.backgroundColor = "Green"
        div.style.color = "red"
        const addText = document.createTextNode(Text)
        div.appendChild(addText)
        document.body.appendChild(div)
    }
    // createDiv("Donkey")
    // createDiv("Monkey")
    // createDiv("sonkey")
    // createDiv("Punkey")

    function createMultipleDiv(myArr,color,num){
        for (let i = 0; i < num; i++) {
            const div = document.createElement('div')
            div.id = i+1
            div.style.backgroundColor = color[i]
            div.style.color = "red"
            const addText = document.createTextNode(myArr[i])
            div.appendChild(addText)
            document.body.appendChild(div)
        }
    }

    Arr = ["Donkey" , "Monkey" , "Sonkey" , "Punkey"]
    col = ["pink", "cyan", "blue", "yellow"]
    createMultipleDiv(Arr,col,4)

</script>
